    // =====================================================

    function updateProgress(step) {

        const percent =
            Math.round(
                (step / 5) * 100
            );


        document.getElementById(
            "progressBar"
        ).style.width =
            `${percent}%`;


        document.getElementById(
            "progressText"

        document.getElementById(
            "progressPercent"

            `${percent}%`;

    // =====================================================
    // STEP NAVIGATION

    function goToStep(step) {

        document
            .querySelectorAll(".step")
            .forEach(
                element => {

                    element.classList.remove(
                        "active"
                    );

                }
            );


        const target =
            document.getElementById(
                `step${step}`
            );


        if (!target) {

            return;

        }


        target.classList.add(
            "active"
        );


        currentStep =
            step;


        updateProgress(
            step
        );


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    // =====================================================
    // STEP 1: CONTINUE -> 0 TO 100
    // =====================================================

    function startStep1() {

        if (step1Started) {

            return;

        }


        step1Started =
            true;


        const button =
            document.getElementById(
                "continue1"
            );


        const progressBox =
            document.getElementById(
                "step1Progress"
            );


        const progressBar =
            document.getElementById(
                "miniBar1"
            );


        const progressText =
            document.getElementById(
                "miniText1"
            );


        button.disabled =
            true;


        progressBox.classList.remove(
            "hidden"
        );


        let value =
            0;


        progressText.textContent =
            "Progress 0%";


        progressBar.style.width =
            "0%";


        const interval =
            setInterval(
                () => {

                    value += 2;


                    if (
                        value >= 100
                    ) {

                        value =
                            100;


                        clearInterval(
                            interval
                        );


                        progressBar.style.width =
                            "100%";


                        progressText.textContent =
                            "✓ Progress 100%";


                        step1ProgressComplete =
                            true;


                        document
                            .getElementById(
                                "step1ScrollArea"
                            )
                            .classList.add(
                                "revealed"
                            );


                        return;

                    }


                    progressBar.style.width =
                        `${value}%`;


                    progressText.textContent =
                        `Progress ${value}%`;

                },
                20
            );

    }

                    "requirement2"
                ).classList.add(
                    "done"
                );


                document.getElementById(
                    "finish2"
                ).disabled =
                    false;


                return;

            }


            // ---------------------------------------------
            // STEP 3
            // ---------------------------------------------

            if (
                currentStep === 3 &&
                !step3AtBottom
            ) {

                step3AtBottom =

                document.getElementById(
                    "requirement3"
                ).classList.add(
                    "done"
                );


                document.getElementById(
                    "finish3"
                ).disabled =
                    false;


                return;

            }


            // ---------------------------------------------

            // ---------------------------------------------

            if (
                currentStep === 4 &&
                !step4AtBottom
            ) {

                step4AtBottom =
                    true;


                document.getElementById(
                    "requirement4"
                ).classList.add(
                    "done"
                );


                document.getElementById(
                    "finish4"
                ).disabled =
                    false;


                return;

            }


            // ---------------------------------------------

            // ---------------------------------------------

            if (
                currentStep === 5 &&
                !step5AtBottom
            ) {

                step5AtBottom =
                    true;


                document.getElementById(
                    "requirement5"
                ).classList.add(
                    "done"
                );


                document.getElementById(
                    "confirmationCheck"
                ).disabled =
                    false;


                updateVerifyButton();

            }

        }

    // =====================================================
    // SMARTLINK
    // =====================================================

    function openSponsoredOffer() {

        if (!SMARTLINK_URL) {

            return;

        }


        window.open(
            SMARTLINK_URL,
            "_blank",
            "noopener,noreferrer"
        );

    }


    // =====================================================
    // VERIFY CHECKBOX
    // =====================================================

    function updateVerifyButton() {

        const check =
            document.getElementById(
                "confirmationCheck"
            );


        const button =
            document.getElementById(
                "verifyButton"
            );


        button.disabled =
            !(
                step5AtBottom &&
                check.checked
            );

    }


    // =====================================================
    // FINAL VERIFICATION
    // =====================================================

    async function completeVerification() {

        const button =
            document.getElementById(
                "verifyButton"
            );


        const status =
            document.getElementById(
                "finalStatus"
            );


        const telegramButton =
            document.getElementById(
                "telegramButton"
            );


        if (!token) {

            status.className =
                "status error";


            status.textContent =
                "❌ Invalid verification link.";


            return;

        }


        button.disabled =
            true;


        status.className =
            "status";


        status.textContent =
            "Verifying your access...";


        try {

            const response =
                await fetch(
                    `${API_URL}/verification/complete`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            token: token
                        })

                    }
                );


            let data = {};


            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.detail ||
                    "Verification failed."
                );

            }


            status.className =
                "status success";


            status.textContent =
                "✅ Verification successful! Your access is active for 20 hours.";


            telegramButton.style.display =
                "block";


            const startTarget =
                videoId
                    ? `video_${videoId}`
                    : "";


            telegramButton.href =
                `https://t.me/${BOT_USERNAME}` +
                (
                    startTarget
                        ? `?start=${encodeURIComponent(startTarget)}`
                        : ""
                );

        } catch (error) {

            button.disabled =
                false;


            status.className =
                "status error";


            status.textContent =
                error.message ||
                "Verification failed. Please try again.";

        }

    }


    // =====================================================
    // INITIAL STATE
    // =====================================================

    updateProgress(1);


</script>
