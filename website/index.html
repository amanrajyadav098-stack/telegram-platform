<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1115;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
            background: #181b22;
            border-radius: 18px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #adb5bd;
            line-height: 1.5;
        }

        button {
            border: 0;
            padding: 14px 28px;
            margin-top: 18px;
            border-radius: 10px;
            background: #229ed9;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            min-height: 24px;
        }

        .success {
            color: #45d483;
        }

        .error {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="card">
    <div style="font-size: 52px;">🔐</div>

    <h1>Verification Required</h1>

    <p>
        Complete verification to activate your 20-hour access.
    </p>

    <button id="verifyButton" onclick="completeVerification()">
        Verify Now
    </button>

    <div id="status"></div>
</div>

<script>
    const API_URL = "https://telegram-platform.onrender.com";

    async function completeVerification() {
        const button = document.getElementById("verifyButton");
        const status = document.getElementById("status");

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        if (!token) {
            status.className = "error";
            status.textContent = "Invalid verification link.";
            button.disabled = true;
            return;
        }

        button.disabled = true;
        status.className = "";
        status.textContent = "Verifying...";

        try {
            const response = await fetch(
                `${API_URL}/verification/complete`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        token: token
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Verification failed."
                );
            }

            status.className = "success";
            status.textContent =
                "✅ Verification successful! Your access is active for 20 hours.";

            button.textContent = "✅ Verified";
        } catch (error) {
            status.className = "error";
            status.textContent = "❌ " + error.message;
            button.disabled = false;
        }
    }
</script>

</body>
</html>
